name: action-evidence-control
run-name: ${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      attempt:
        type: string
        required: true
permissions:
  contents: read
jobs:
  probe:
    environment: commitish-evidence-delay
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - id: probe
        uses: "kjanat/action-ref-fixtures@f246546a80a6619dabe2859c34984e647f364dcd"
      - name: Record observed marker
        env:
          MARKER: ${{ steps.probe.outputs.marker }}
        run: printf 'COMMITISH_OBSERVED=%s\n' "$MARKER"
